<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四則計算トレーニング</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:24px}.card{max-width:680px;margin:auto;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 28px #1b2a4a18}h1{margin-top:0;font-size:1.65rem}label{display:block;margin:14px 0 6px;font-weight:700}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #bac4d3;border-radius:10px}button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#1769e0;color:white;font-weight:700}.secondary{background:#e8eef8;color:#18375e}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.problem{text-align:center;font-size:2.7rem;font-weight:800;margin:32px 0 20px}.status{text-align:center;min-height:2em;font-weight:800;font-size:1.2rem}.correct{color:#087a39}.wrong{color:#bd2525}.meta{display:flex;justify-content:space-between;color:#516079;margin-top:8px}.answer{font-size:1.5rem;text-align:center}.summary{background:#f3f7fd;border-radius:12px;padding:16px;margin:18px 0}.mistakes{max-height:230px;overflow:auto;background:#fafbfc;border:1px solid #e3e8ef;border-radius:10px;padding:10px}.note{font-size:.9rem;color:#5d6879}button:focus,input:focus,select:focus{outline:3px solid #acd0ff;outline-offset:2px}@media(max-width:480px){body{padding:10px}.card{padding:18px}.problem{font-size:2.25rem}}
</style>
</head>
<body>
<main class="card">
<h1>四則計算トレーニング</h1>
<section id="setup">
<label for="student">組・番号／生徒コード</label>
<input id="student" maxlength="30" placeholder="例：2A-15">
<div class="row">
<div><label for="count">終了する正答数</label><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></div>
<div><label for="mode">問題</label><select id="mode"><option value="mix">四則混合</option><option value="add">足し算</option><option value="sub">引き算</option><option value="mul">掛け算</option><option value="div">割り算</option></select></div>
</div>
<fieldset style="margin:16px 0;border:1px solid #d8e0eb;border-radius:12px;padding:14px"><legend style="font-weight:700">負の数</legend><label style="display:inline-flex;align-items:center;gap:7px;margin:4px 18px 4px 0;font-weight:600"><input type="radio" name="negativeMode" value="off" checked style="width:auto"> 出ない</label><label style="display:inline-flex;align-items:center;gap:7px;margin:4px 0;font-weight:600"><input type="radio" name="negativeMode" value="on" style="width:auto"> 出る</label><p class="note" style="margin-bottom:0">「出ない」：1～9の正の数だけで計算します（引き算も答えは0以上）。「出る」：−9～9の整数を使い、答えが負になる問題も出ます。</p></fieldset>
<p id="setupError" class="status wrong" aria-live="polite"></p>
<button id="start" type="button">スタート</button>
</section>
<section id="quiz" class="hidden">
<div class="meta"><span id="progress"></span><span id="score"></span></div>
<div id="problem" class="problem"></div>
<label for="answer">答え</label>
<input id="answer" class="answer" inputmode="numeric" autocomplete="off">
<div style="text-align:center;margin-top:12px"><button id="submit" type="button">答える</button></div>
<div id="feedback" class="status" aria-live="polite"></div>
</section>
<section id="result" class="hidden">
<h2>終了！</h2>
<div id="summary" class="summary"></div>
<h3>間違えた問題</h3><div id="mistakes" class="mistakes"></div>
<div class="row" style="margin-top:16px"><button id="share" type="button">結果を共有</button><button id="copy" class="secondary" type="button">結果をコピー</button><button id="csv" class="secondary" type="button">CSVで保存</button><button id="again" class="secondary" type="button">もう一度</button></div>
<label for="resultText">コピーできない場合は、下の結果を長押しして「すべて選択」→「コピー」</label><textarea id="resultText" readonly rows="9" style="width:100%;padding:10px;border:1px solid #bac4d3;border-radius:10px;font:inherit"></textarea>
<p id="copyStatus" class="note" aria-live="polite"></p>
<p class="note">このHTML単体では教員へ自動送信しません。「結果をコピー」でForms等へ貼り付けるか、CSVを提出してください。</p>
</section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let total=20,mode='mix',student='',n=0,good=0,current=null,startAt=0,qAt=0,rows=[],negativeMode=false;
const opLabel={add:'＋',sub:'－',mul:'×',div:'÷'};
function randInt(lo,hi){return lo+Math.floor(Math.random()*(hi-lo+1))}
function nonZero(lo,hi){let x=0;do{x=randInt(lo,hi)}while(x===0);return x}
function make(){let op=mode==='mix'?['add','sub','mul','div'][Math.floor(Math.random()*4)]:mode;const fmt=x=>x<0?`(${x})`:`${x}`;let a,b,ans;if(!negativeMode){a=randInt(1,9);b=randInt(1,9);if(op==='sub'&&a<b)[a,b]=[b,a];if(op==='div'){b=randInt(1,9);const q=randInt(1,9);a=b*q;ans=q}else if(op==='add')ans=a+b;else if(op==='sub')ans=a-b;else ans=a*b;}else{a=randInt(-9,9);b=randInt(-9,9);if(op==='div'){b=nonZero(-9,9);const q=randInt(-9,9);a=b*q;ans=q}else if(op==='add')ans=a+b;else if(op==='sub')ans=a-b;else ans=a*b;}return{a,b,op,ans,text:`${fmt(a)} ${opLabel[op]} ${fmt(b)}`}}
function next(){if(good>=total)return finish();current=make();qAt=Date.now();$('problem').textContent=current.text+' ＝ ?';$('progress').textContent=`挑戦 ${n+1}問目`;$('score').textContent=`正解 ${good} / ${total}問`;$('answer').value='';$('feedback').textContent='';$('feedback').className='status';$('answer').focus()}
function judge(){const raw=$('answer').value.trim();if(raw===''||!/^[-+]?\d+$/.test(raw)){ $('feedback').textContent='数字で答えてください。';$('feedback').className='status wrong';return}const val=Number(raw),ok=val===current.ans,sec=((Date.now()-qAt)/1000).toFixed(1);if(ok)good++;rows.push({no:n+1,problem:current.text,answer:val,correct:current.ans,result:ok?'正解':'不正解',seconds:sec});n++;$('feedback').textContent=ok?'○ 正解！':`× 正解は ${current.ans}`;$('feedback').className='status '+(ok?'correct':'wrong');$('score').textContent=`正解 ${good} / ${total}問`;setTimeout(next,650)}
function resultText(){const elapsed=Math.round((Date.now()-startAt)/1000),pct=Math.round(good/n*100);return `生徒コード：${student}\n実施日時：${new Date().toLocaleString('ja-JP')}\n問題：${$('mode').selectedOptions[0].textContent}\n負の数：${negativeMode?'出る':'出ない'}\n終了条件：${total}問正解\n挑戦数：${n}問\n正答数：${good}問\n正答率：${pct}%\n所要時間：${Math.floor(elapsed/60)}分${elapsed%60}秒\n\n`+rows.map(r=>`${r.no}問目  ${r.problem}  解答:${r.answer}  正答:${r.correct}  ${r.result}  ${r.seconds}秒`).join('\n')}
function finish(){const elapsed=Math.round((Date.now()-startAt)/1000),pct=Math.round(good/n*100);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('summary').innerHTML=`<b>${total}問正解を達成しました</b><br>挑戦数：${n}問　正答率：${pct}%<br>所要時間：${Math.floor(elapsed/60)}分${elapsed%60}秒` ;$('resultText').value=resultText();const bad=rows.filter(r=>r.result==='不正解');$('mistakes').textContent=bad.length?bad.map(r=>`${r.no}問目　${r.problem}　あなた:${r.answer}　正答:${r.correct}`).join('\n'):'全問正解です！'}
$('start').addEventListener('click',()=>{student=$('student').value.trim()||'未入力';total=Math.max(1,Math.min(100,Number($('count').value)||20));mode=$('mode').value;negativeMode=document.querySelector('input[name="negativeMode"]:checked').value==='on';$('setupError').textContent='';n=good=0;rows=[];startAt=Date.now();$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');next()});$('submit').addEventListener('click',judge);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')judge()});$('again').addEventListener('click',()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden')});$('copy').addEventListener('click',async()=>{const text=resultText();let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(!ok){const t=$('resultText');t.value=text;t.focus();t.select();t.setSelectionRange(0,t.value.length);try{ok=document.execCommand('copy')}catch(e){}}$('copyStatus').textContent=ok?'結果をコピーしました。Forms等に貼り付けられます。':'自動コピーできませんでした。上の結果欄を長押しして、すべて選択→コピーしてください。'});
$('share').addEventListener('click',async()=>{const text=resultText();if(navigator.share){try{await navigator.share({title:'四則計算トレーニング結果',text});$('copyStatus').textContent='共有画面を開きました。';return}catch(e){if(e.name==='AbortError')return}}$('resultText').value=text;$('resultText').focus();$('resultText').select();$('copyStatus').textContent='この環境では共有画面を開けません。結果欄を長押ししてコピーしてください。'});
$('csv').addEventListener('click',()=>{const esc=s=>'"'+String(s).replaceAll('"','""')+'"',head=['生徒コード','実施日時','問題番号','問題','生徒解答','正答','結果','解答時間(秒)'],dt=new Date().toLocaleString('ja-JP'),lines=[head,...rows.map(r=>[student,dt,r.no,r.problem,r.answer,r.correct,r.result,r.seconds])],csv='\ufeff'+lines.map(x=>x.map(esc).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`計算練習_${student.replace(/[^\w\-\u3040-\u30ff\u4e00-\u9faf]/g,'_')}.csv`;a.style.display='none';document.body.appendChild(a);a.click();$('copyStatus').textContent='CSVの保存を開始しました。スマホでは「ダウンロード」または「ファイル」アプリを確認してください。';setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},5000)});
})();
</script>
</body></html>
