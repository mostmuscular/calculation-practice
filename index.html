<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四則計算トレーニング</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f5f7fb;color:#172033;font-family:system-ui,sans-serif}.card{max-width:680px;margin:auto;padding:22px;background:#fff;border-radius:18px;box-shadow:0 8px 28px #1b2a4a18}h1{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:700}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #bac4d3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:700}.secondary{background:#e8eef8;color:#18375e}.row,.answerRow{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.answer{font-size:1.5rem;text-align:center;flex:1;min-width:0}.minus{flex:0 0 64px;background:#43536b;font-size:1.7rem}.hidden{display:none}.problem{text-align:center;font-size:2.7rem;font-weight:800;margin:30px 0}.meta{display:flex;justify-content:space-between;color:#516079}.status{text-align:center;min-height:2em;font-weight:800}.ok{color:#087a39}.ng{color:#bd2525}.box{padding:16px;background:#f3f7fd;border-radius:12px}.mistakes{white-space:pre-wrap;max-height:230px;overflow:auto;padding:10px;background:#fafbfc;border:1px solid #e3e8ef;border-radius:10px}.note{font-size:.9rem;color:#5d6879}fieldset{margin:16px 0;border:1px solid #d8e0eb;border-radius:12px}.radio{display:inline-flex;align-items:center;gap:6px;margin-right:18px}.radio input{width:auto}@media(max-width:480px){.card{padding:17px}.row{flex-direction:column}.problem{font-size:2.2rem}}</style></head><body><main class="card"><h1>四則計算トレーニング</h1><section id="setup"><label for="student">組・番号／生徒コード</label><input id="student" placeholder="例：2A-15" maxlength="30"><div class="row"><div><label for="goal">終了する正答数</label><select id="goal"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></div><div><label for="mode">問題</label><select id="mode"><option value="mix">四則混合</option><option value="add">足し算</option><option value="sub">引き算</option><option value="mul">掛け算</option><option value="div">割り算</option></select></div></div><fieldset><legend>負の数</legend><label class="radio"><input type="radio" name="neg" value="off" checked>出ない</label><label class="radio"><input type="radio" name="neg" value="on">出る</label><p class="note">「出ない」では正の数だけを使い、引き算の答えも0以上です。「出る」では負の数を使い、答えが負になる問題も出ます。</p></fieldset><button id="start" type="button">スタート</button></section><section id="quiz" class="hidden"><div class="meta"><span id="progress"></span><span id="score"></span></div><div id="problem" class="problem"></div><label for="answer">答え</label><div class="answerRow"><input id="answer" class="answer" inputmode="numeric" autocomplete="off"><button id="minus" class="minus" type="button" aria-label="マイナスを付ける、または外す">−</button></div><div style="text-align:center;margin-top:12px"><button id="submit" type="button">答える</button></div><div id="feedback" class="status" aria-live="polite"></div></section><section id="result" class="hidden"><h2>終了！</h2><div id="summary" class="box"></div><h3>間違えた問題</h3><div id="mistakes" class="mistakes"></div><div class="row" style="margin-top:16px"><button id="copy" type="button">結果をコピー</button><button id="again" class="secondary" type="button">もう一度</button></div><label for="resultText">コピーできない場合は、下の結果を長押ししてコピー</label><textarea id="resultText" readonly rows="9"></textarea><p id="copyStatus" class="note" aria-live="polite"></p></section></main><script>(()=>{const $=x=>document.getElementById(x),ops={add:'＋',sub:'－',mul:'×',div:'÷'};let goal,mode,neg,student,n=0,good=0,cur,startAt,qAt,rows=[];const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));function nz(){let x=0;while(!x)x=rnd(-9,9);return x}function make(){let op=mode==='mix'?['add','sub','mul','div'][rnd(0,3)]:mode,a,b,ans,fmt=x=>x<0?`(${x})`:`${x}`;if(!neg){a=rnd(1,9);b=rnd(1,9);if(op==='sub'&&a<b)[a,b]=[b,a];if(op==='div'){b=rnd(1,9);ans=rnd(1,9);a=b*ans}else ans=op==='add'?a+b:op==='sub'?a-b:a*b}else{a=rnd(-9,9);b=rnd(-9,9);if(op==='div'){b=nz();do{ans=rnd(-9,9)}while(ans===0);a=b*ans}else ans=op==='add'?a+b:op==='sub'?a-b:a*b}return{text:`${fmt(a)} ${ops[op]} ${fmt(b)}`,ans}}function next(){if(good>=goal)return finish();cur=make();qAt=Date.now();$('problem').textContent=cur.text+' ＝ ?';$('progress').textContent=`挑戦 ${n+1}問目`;$('score').textContent=`正解 ${good} / ${goal}問`;$('answer').value='';$('feedback').textContent='';$('answer').focus()}function judge(){let raw=$('answer').value.trim();if(!/^[-−]?\d+$/.test(raw)){$('feedback').textContent='数字で答えてください。';$('feedback').className='status ng';return}let val=Number(raw.replace('−','-')),ok=val===cur.ans;if(ok)good++;rows.push({no:++n,p:cur.text,a:val,c:cur.ans,r:ok?'正解':'不正解',s:((Date.now()-qAt)/1000).toFixed(1)});$('feedback').textContent=ok?'○ 正解！':`× 正解は ${cur.ans}`;$('feedback').className='status '+(ok?'ok':'ng');setTimeout(next,650)}function text(){let sec=Math.round((Date.now()-startAt)/1000),pct=Math.round(good/n*100);return `生徒コード：${student}\n実施日時：${new Date().toLocaleString('ja-JP')}\n問題：${$('mode').selectedOptions[0].textContent}\n負の数：${neg?'出る':'出ない'}\n終了条件：${goal}問正解\n挑戦数：${n}問\n正答数：${good}問\n正答率：${pct}%\n所要時間：${Math.floor(sec/60)}分${sec%60}秒\n\n`+rows.map(x=>`${x.no}問目  ${x.p}  解答:${x.a}  正答:${x.c}  ${x.r}  ${x.s}秒`).join('\n')}function finish(){let sec=Math.round((Date.now()-startAt)/1000),pct=Math.round(good/n*100),bad=rows.filter(x=>x.r==='不正解');$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('summary').innerHTML=`<b>${goal}問正解を達成しました</b><br>挑戦数：${n}問　正答率：${pct}%<br>所要時間：${Math.floor(sec/60)}分${sec%60}秒`;$('mistakes').textContent=bad.length?bad.map(x=>`${x.no}問目　${x.p}　あなた:${x.a}　正答:${x.c}`).join('\n'):'全問正解です！';$('resultText').value=text()}$('start').onclick=()=>{student=$('student').value.trim()||'未入力';goal=Number($('goal').value);mode=$('mode').value;neg=document.querySelector('input[name="neg"]:checked').value==='on';n=good=0;rows=[];startAt=Date.now();$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');next()};$('minus').onclick=()=>{let a=$('answer');a.value=a.value.startsWith('-')?'':'-'+a.value.replace(/^[-−]/,'');a.focus()};$('submit').onclick=judge;$('answer').onkeydown=e=>{if(e.key==='Enter')judge()};$('again').onclick=()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden')};$('copy').onclick=async()=>{let t=text(),ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch{}if(!ok){let x=$('resultText');x.value=t;x.focus();x.select();try{ok=document.execCommand('copy')}catch{}}$('copyStatus').textContent=ok?'結果をコピーしました。':'自動コピーできませんでした。下の結果欄を長押ししてコピーしてください。'}})();</script></body></html>
